<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15110C" />
  <title>Fávoa · sem conexão</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #15110C; color: #F3EBDD; font-family: system-ui, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .cartao { max-width: 380px; display: flex; flex-direction: column; gap: 14px; padding: 28px 24px; border-radius: 22px; background: #1D1711; border: 1px solid #3A2D1C; }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 0; color: #C9B99E; line-height: 1.5; }
    button { min-height: 48px; border: 0; border-radius: 12px; background: #F2A93B; color: #1A140D; font-weight: 700; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="cartao">
      <img src="/icones/favoa-192.png" width="56" height="56" alt="" />
      <h1>O Fávoa não respondeu</h1>
      <p>Ele roda no seu computador. Confira se o PC está ligado, com o Fávoa aberto, e se o celular está na mesma Wi-Fi (ou com o Tailscale ligado).</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
  </main>
</body>
</html>
